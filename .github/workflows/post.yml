name: Post to Instagram
on:
  schedule:
    - cron: "30 2 * * *"   # 08:00 IST  post1
    - cron: "30 8 * * *"   # 14:00 IST  post2
    - cron: "30 16 * * *"  # 22:00 IST  post3
  workflow_dispatch:
    inputs:
      slot: {description: "post number 1-3", required: true, default: "1"}
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python post.py "${{ github.event.inputs.slot }}"
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
      - run: |
          git config user.name "wayout-bot"
          git config user.email "actions@users.noreply.github.com"
          python index.py
          git add queue index.json && git commit -m "posted" && git push || true
